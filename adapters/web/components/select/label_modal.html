{{define "label_modal"}}
<div x-cloak x-data @keydown.escape.window="Annotation.Annotator.abort()">
  <div
    x-cloak
    x-show="Annotation.LabelPicker.isOpen()"
    x-transition.opacity.duration.200ms
    x-trap.inert.noscroll="Annotation.LabelPicker.isOpen()"
    x-on:keydown.esc.window="Annotation.Annotator.abort()"
    x-on:click.self="Annotation.Annotator.abort()"
    class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8"
    role="dialog"
    aria-modal="true"
    aria-labelledby="defaultModalTitle">
<!-- Modal Dialog -->
    <div
      x-show="Annotation.LabelPicker.isOpen()"
      x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity"
      x-transition:enter-start="opacity-0 scale-50"
      x-transition:enter-end="opacity-100 scale-100"
      class="flex w-96 flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface-alt text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark-alt">
        {{template "label_modal_search_combobox" .}}
    </div>
</div>
{{end}}
