{{define "label_modal"}}
<div x-cloak x-data @keydown.escape.window="Annotation.Annotator.abort()">
  <div
    x-cloak
    x-show="Annotation.LabelPicker.isOpen()"
    x-trap.inert.noscroll="Annotation.LabelPicker.isOpen()"
    x-on:keydown.esc.window="Annotation.Annotator.abort()"
    x-on:click.self="Annotation.Annotator.abort()"
    class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8  sm:items-center lg:p-8"
    role="dialog"
    aria-modal="true"
    aria-labelledby="defaultModalTitle">
<!-- Modal Dialog -->
    <div
      x-show="Annotation.LabelPicker.isOpen()"
      class="flex w-96 flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface-alt text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark-alt"> 
      <form
	id="labelForm"
	x-on:submit.prevent="Annotator.submit($event.target.{{ .FieldName }}.value)">
	<div class="align-top px-4 py-4">
	  {{template "search_combobox" .}}
	  <div
            class="flex flex-col-reverse justify-between sm:flex-row sm:items-center md:justify-end pt-2 pb-1"
        >
            <button
                type="submit"
                class="whitespace-nowrap rounded-radius bg-primary border border-primary dark:border-primary-dark px-4 py-2 text-center text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 dark:bg-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark">
                Submit
            </button>
        </div>

	</div>
      </form>
    </div>
</div>
{{end}}
