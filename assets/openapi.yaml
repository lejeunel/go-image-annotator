openapi: "3.0.0"
info:
  version: 1.0.0
  title: go-image-annotator API
  description: Image Annotation Service
  termsOfService: https://swagger.io/terms/
  contact:
    name: Swagger API Team
    email: apiteam@swagger.io
    url: https://swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api
paths:
  /whoami:
    get:
      summary: Get current user's identity
      description: Get user's identity, groups and roles
      operationId: whoAmI
      tags: [User]
      responses:
        '200':
          description: User's identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /raw/{image_id}:
    get:
      summary: Read image raw-data
      description: Read raw-data of an image
      operationId: readRawImage
      tags: [Image]
      parameters:
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      responses:
        '200':
          description: image raw-data response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              description: MIME type of the returned image
              schema:
                type: string
            Content-Length:
              description: Size of the image in bytes
              schema:
                type: integer
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /images/{collection_name}/{image_id}:
    get:
      summary: Read image meta-data
      description: Read meta-data of an image
      operationId: readImage
      tags: [Image]
      parameters:
        - name: collection_name
          in: path
          description: Name of collection
          required: true
          schema:
            type: string
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      responses:
        '200':
          description: image meta-data response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /images:
    get:
      summary: List images
      description: Retrieve image meta-data given filtering criteria
      operationId: listImages
      tags: [Image]
      parameters:
        - name: page
          in: query
          description: page number
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: maximum number of images to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: filter
          in: query
          description: filtering expression
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: ordering expression
          required: false
          schema:
            type: string
      responses:
        '200':
          description: list image response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImagesResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Ingest a new image
      description: Ingest an image into a collection.
      operationId: ingestImage
      tags: [Image]
      requestBody:
        description: Ingestion payload
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - image
              properties:
                metadata:
                  $ref: '#/components/schemas/NewImage'
                image:
                  type: string
                  format: binary
                  description: Raw image data
            encoding:
              metadata:
                contentType: application/json
              image:
                contentType: image/*
      responses:
        '201':
          description: image ingestion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageIngestionResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /collections/{name}:
    get:
      summary: Find a collection by name
      description: Returns a collection based on its name
      operationId: findCollectionByName
      tags: [Collection]
      parameters:
        - name: name
          in: path
          description: Name of collection to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a collection
      description: Update the name and description of a collection
      operationId: updateCollectionByName
      tags: [Collection]
      parameters:
        - name: name
          in: path
          required: true
          description: Current name of the collection
          schema:
            type: string
      requestBody:
        description: New values for the collection
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollection'
      responses:
        '200':
          description: Collection updated successfully
        '404':
          description: Collection not found
        '400':
          description: Invalid input
    delete:
      summary: Delete a collection by name
      description: Delete a collection based on its name
      operationId: deleteCollectionByName
      tags: [Collection]
      parameters:
        - name: name
          in: path
          description: Name of collection to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: collection deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /annotate/{id}:
    delete:
      summary: Delete annotation by id
      description: Delete an annotation based on its id
      operationId: deleteAnnotationById
      tags: [Annotate]
      parameters:
        - name: id
          in: path
          description: Id of annotation to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: annotation deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /annotate/{id}/{label}:
    put:
      summary: Change label
      description: Change annotation label given its id
      operationId: updateAnnotationById
      tags: [Annotate]
      parameters:
        - name: label
          in: path
          description: Label to assign
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Id of annotation to update
          required: true
          schema:
            type: string
      responses:
        '204':
          description: annotation updated
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /annotate/box:
    post:
      summary: Add a bounding-box
      description: Add a bounding-box to an image given its id and collection name.
      operationId: addBoundingBox
      tags: [Annotate]
      requestBody:
        description: Bounding-box and target specification
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBoundingBox'
      responses:
        '204':
          description: New bounding-box response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /annotate/polygon:
    post:
      summary: Add a polygon
      description: Add a polygon to an image given its id and collection name.
      operationId: addPolygon
      tags: [Annotate]
      requestBody:
        description: Polygon and target specification
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPolygon'
      responses:
        '204':
          description: New polygon response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    post:
      summary: Create a new user
      description: Creates a new user. Duplicate id are not allowed
      operationId: createUser
      tags: [User]
      requestBody:
        description: User to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections:
    get:
      summary: List collections
      description: Paginate collections
      operationId: listCollections
      tags: [Collection]
      parameters:
        - name: page
          in: query
          description: page number
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: maximum number of collections to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: list collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new collection
      description: Creates a new collection. Duplicate names are not allowed
      operationId: createCollection
      tags: [Collection]
      requestBody:
        description: Collection to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCollection'
      responses:
        '200':
          description: collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /collections/clone:
    post:
      summary: Clone a collection
      description: Clone an existing collection
      operationId: cloneCollection
      tags: [Collection]
      requestBody:
        description: Clone collection payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCollection'
      responses:
        '200':
          description: task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      
  /labels/{name}:
    get:
      summary: Find a label by name
      description: Returns a label based on its name
      operationId: findLabelByName
      tags: [Label]
      parameters:
        - name: name
          in: path
          description: Name of label to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a label by name
      description: Delete a label based on its name
      operationId: deleteLabelByName
      tags: [Label]
      parameters:
        - name: name
          in: path
          description: Name of label to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: label deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /labels:
    get:
      summary: List labels
      description: Returns all labels
      operationId: listLabels
      tags: [Label]
      parameters:
        - name: page
          in: query
          description: page number
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: maximum number of labels to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: list label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLabelsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new label
      description: Creates a new label. Duplicate names are not allowed
      operationId: createLabel
      tags: [Label]
      requestBody:
        description: Label to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabel'
      responses:
        '200':
          description: label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Pagination:
      required:
        - page
        - page_size
        - total_items
        - total_pages
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
          description: current page number
        page_size:
          type: integer
          minimum: 1
          description: maximum number of items per page
        total_items:
          type: integer
          format: int64
          description: total number of items
        total_pages:
          type: integer
          format: int64
          description: total number of pages
    Collection:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        description:
          type: string
          description: Description of the collection
    UpdateCollection:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: New name of the collection
        description:
          type: string
          description: New description of the collection
    CloneCollection:
      type: object
      required:
        - source
        - destination
      properties:
        source:
          type: string
          description: Name of the existing source collection
        destination:
          type: string
          description: Name of the destination collection
        group:
          type: string
          description: Name of the group of destination collection
        deep:
          type: boolean
          description: Also clone annotations and meta-data
    ListCollectionsResponse:
      type: object
      required:
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListImagesResponse:
      type: object
      required:
        - images
        - pagination
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Image:
      required:
        - id
        - collection
      properties:
        id:
          type: string
          description: ID of the image
        collection:
          type: string
          description: name of collection in which the image belongs
        labels:
          type: array
          items:
            type: string
        bounding_boxes:
          type: array
          items:
            $ref: '#/components/schemas/BoundingBox'
        polygons:
          type: array
          items:
            $ref: '#/components/schemas/Polygon'
        meta:
          type: object
          additionalProperties: {}
    NewImage:
      required:
        - collection
      properties:
        collection:
          type: string
          description: name of collection in which to add the image
        labels:
          type: array
          items:
            type: string
        bounding_boxes:
          type: array
          items:
            $ref: '#/components/schemas/IngestBoundingBox'
    IngestBoundingBox:
      required:
        - label
        - xc
        - yc
        - width
        - height
      properties:
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
    AddBoundingBox:
      required:
        - imageId
        - collection
        - label
        - xc
        - yc
        - width
        - height
        - angle
      properties:
        imageId:
          type: string
          description: id of image
        collection:
          type: string
          description: name of collection
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
        angle:
          type: number
          description: angle of the bounding box
    AddPolygon:
      required:
        - imageId
        - collection
        - label
        - points
      properties:
        imageId:
          type: string
          description: ID of the image
        collection:
          type: string
          description: name of the collection
        label:
          type: string
          description: Label of the polygon
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    BoundingBox:
      required:
        - label
        - xc
        - yc
        - width
        - height
        - id
      properties:
        id:
          type: string
          description: ID of the bounding box
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
    ImageIngestionResponse:
      properties:
        id:
          type: string
          description: ID of ingested image
    Point:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
    Polygon:
      required:
        - id
        - label
        - points
      properties:
        id:
          type: string
          description: ID of the polygon
        label:
          type: string
          description: Label of the polygon
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    NewUser:
      required:
        - id
      properties:
        id:
          type: string
          description: Id of the new user
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    User:
      required:
        - id
        - groups
        - roles
      properties:
        id:
          type: string
          description: Id of the user
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    NewCollection:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        description:
          type: string
          description: Description of the collection
    Label:
      properties:
        name:
          type: string
          description: Name of the label
        description:
          type: string
          description: Description of the label
    ListLabelsResponse:
      type: object
      required:
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        pagination:
          $ref: '#/components/schemas/Pagination'
    TaskResponse:
      required:
        - task_id
        - issuer
        - type
      properties:
        task_id:
          type: string
          description: Id of the generated background task
        issuer:
          type: string
          description: Id of the issuing user
        type:
          type: string
          description: Type of submitted task
    NewLabel:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the label
        description:
          type: string
          description: Description of the label
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message
