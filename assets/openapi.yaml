          description: Type of submitted task
    NewLabel:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the label
        description:
          type: string
          description: Description of the label
    Profile:
      required:
        - name
        - labels
      properties:
        name:
          type: string
          description: Name of the profile
        description:
          type: string
