openapi: "3.0.0"
info:
  version: 1.0.0
  title: go-image-annotator API
  description: >-
    Manage, store and annotate images.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: /api
paths:
  /raw/{image_id}:
    get:
      summary: Read image raw-data
      description: Read raw-data of an image
      operationId: readRawImage
      tags: [Image]
      parameters:
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      responses:
        '200':
          description: image raw-data response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              description: MIME type of the returned image
              schema:
                type: string
            Content-Length:
              description: Size of the image in bytes
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /images/{collection_name}/{image_id}:
    get:
      summary: Read image meta-data
      description: Read meta-data of an image
      operationId: readImage
      tags: [Image]
      parameters:
        - name: collection_name
          in: path
          description: Name of collection
          required: true
          schema:
            type: string
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      responses:
        '200':
          description: image meta-data response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete an image
      description: Delete an image from a collection
      operationId: deleteImage
      tags: [Image]
      parameters:
        - name: collection_name
          in: path
          description: Name of collection
          required: true
          schema:
            type: string
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      responses:
        '204':
          description: image deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /images:
    get:
      summary: List images
      description: Retrieve image meta-data given filtering criteria
      operationId: listImages
      tags: [Image]
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: filter
          in: query
          description: filtering expression
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: ordering expression
          required: false
          schema:
            type: string
      responses:
        '200':
          description: list image response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Ingest a new image
      description: Ingest an image into a collection.
      operationId: ingestImage
      tags: [Image]
      requestBody:
        description: Ingestion payload
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - image
              properties:
                metadata:
                  $ref: '#/components/schemas/NewImage'
                image:
                  type: string
                  format: binary
                  description: Raw image data
            encoding:
              metadata:
                contentType: application/json
              image:
                contentType: image/*
      responses:
        '201':
          description: image ingestion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageIngestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /collections/{name}:
    get:
      summary: Find a collection by name
      description: Returns a collection based on its name
      operationId: findCollectionByName
      tags: [Collection]
      parameters:
        - name: name
          in: path
          description: Name of collection to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Update a collection
      operationId: updateCollection
      tags: [Collection]
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the collection to update
          schema:
            type: string
      requestBody:
        description: Updated values
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollection'
      responses:
        '200':
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a collection by name
      description: Delete a collection based on its name
      operationId: deleteCollection
      tags: [Collection]
      parameters:
        - name: name
          in: path
          description: Name of collection to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: collection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /annotate/{id}:
    delete:
      summary: Delete annotation by id
      description: Delete an annotation based on its id
      operationId:  deleteAnnotation
      tags: [Annotate]
      parameters:
        - name: id
          in: path
          description: Id of annotation to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: annotation deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /annotate/{id}/{label}:
    put:
      summary: Change label
      description: Change annotation label given its id
      operationId: updateAnnotation
      tags: [Annotate]
      parameters:
        - name: label
          in: path
          description: Label to assign
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Id of annotation to update
          required: true
          schema:
            type: string
      responses:
        '204':
          description: annotation updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /annotate/box:
    post:
      summary: Add a bounding-box
      description: Add a bounding-box to an image given its id and collection name.
      operationId: addBoundingBox
      tags: [Annotate]
      requestBody:
        description: Bounding-box and target specification
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBoundingBox'
      responses:
        '204':
          description: New bounding-box response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /annotate/polygon:
    post:
      summary: Add a polygon
      description: Add a polygon to an image given its id and collection name.
      operationId: addPolygon
      tags: [Annotate]
      requestBody:
        description: Polygon and target specification
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPolygon'
      responses:
        '204':
          description: New polygon response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /collections:
    get:
      summary: List collections
      description: Paginate collections
      operationId: listCollections
      tags: [Collection]
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: list collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollections'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a new collection
      description: Creates a new collection. Duplicate names are not allowed
      operationId: createCollection
      tags: [Collection]
      requestBody:
        description: Collection to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCollection'
      responses:
        '200':
          description: collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /collections/clone:
    post:
      summary: Clone a collection
      description: Clone an existing collection
      operationId: cloneCollection
      tags: [Collection]
      requestBody:
        description: Clone collection payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCollection'
      responses:
        '200':
          description: task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /labels/{name}:
    get:
      summary: Find a label by name
      description: Returns a label based on its name
      operationId: findLabel
      tags: [Label]
      parameters:
        - name: name
          in: path
          description: Name of label to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a label by name
      description: Delete a label based on its name
      operationId: deleteLabel
      tags: [Label]
      parameters:
        - name: name
          in: path
          description: Name of label to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: label deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/FailedDependency'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /labels:
    get:
      summary: List labels
      description: Returns all labels
      operationId: listLabels
      tags: [Label]
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: list label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLabels'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a new label
      description: Creates a new label. Duplicate names are not allowed
      operationId: createLabel
      tags: [Label]
      requestBody:
        description: Label to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabel'
      responses:
        '200':
          description: label response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /meta/{collection_name}/{image_id}:
    post:
      summary: Upsert meta-data
      description: Add or update meta-data to an image
      operationId: upsertMetadata
      tags: [Metadata]
      parameters:
        - name: collection_name
          in: path
          description: Name of collection
          required: true
          schema:
            type: string
        - name: image_id
          in: path
          description: ID of image
          required: true
          schema:
            type: string
      requestBody:
        description: Key and value to upsert 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meta'
      responses:
        '200':
          description: image meta-data response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /meta/{collection_name}/{image_id}/{key}:
    delete:
      summary: Delete a meta-data entry
      description: Delete a meta-data entry given its collection, image id, and key
      operationId: deleteMetadata
      tags: [Metadata]
      parameters:
        - name: collection_name
          in: path
          description: Name of the collection
          required: true
          schema:
            type: string
        - name: image_id
          in: path
          description: Id of the image
          schema:
            type: string
        - name: key
          in: path
          description: key of the meta-data entry to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: meta-data entry deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /users:
    post:
      summary: Create a new user
      description: Creates a new user. Duplicate id are not allowed
      operationId: createUser
      tags: [User]
      requestBody:
        description: User to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
    get:
      summary: List users
      description: Paginate users
      operationId: listUsers
      tags: [User]
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: list users response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{id}:
    put:
      summary: Update user privileges
      description: Update privileges of a user given its id
      operationId: updateUser
      tags: [User]
      parameters:
        - name: id
          in: path
          description: Id of user
          required: true
          schema:
            type: string
      requestBody:
        description: User privileges
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPrivileges'
      responses:
        '204':
          description: annotation updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a user
      description: Delete a user by id
      operationId: deleteUser
      tags: [User]
      parameters:
        - name: id
          in: path
          description: Id of the user to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: user deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /whoami:
    get:
      summary: Get current user's identity
      description: Get user's identity, groups and roles
      operationId: whoAmI
      tags: [User]
      responses:
        '200':
          description: User's identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /profiles/{name}:
    get:
      summary: Find a profile by name
      description: Returns a profile based on its name
      operationId: findProfile
      tags: [Profile]
      parameters:
        - name: name
          in: path
          description: Name of profile to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: profile response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Update a profile
      operationId: updateProfile
      tags: [Profile]
      parameters:
        - name: name
          in: path
          description: Name of profile to update
          required: true
          schema:
            type: string
      requestBody:
        description: Updated values
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
      responses:
        '200':
          description: profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a profile by name
      description: Delete a profile based on its name
      operationId: deleteProfile
      tags: [Profile]
      parameters:
        - name: name
          in: path
          description: Name of profile to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: profile deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/FailedDependency'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /profiles:
    post:
      summary: Create a new profile
      description: Creates a new profile. Duplicate names are not allowed
      operationId: createProfile
      tags: [Profile]
      requestBody:
        description: Profile to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProfile'
      responses:
        '200':
          description: profile response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /groups/{name}:
    get:
      summary: Find a group by name
      description: Returns a group based on its name
      operationId: findGroup
      tags: [Group]
      parameters:
        - name: name
          in: path
          description: Name of group to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: group response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Update a group
      description: >-
        Replace the group's representation. Any optional field omitted from the
        request body is cleared.
      operationId: updateGroup
      tags: [Group]
      parameters:
        - name: name
          in: path
          description: Current name of the group
          required: true
          schema:
            type: string
      requestBody:
        description: New values for the group
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroup'
      responses:
        '200':
          description: group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a group by name
      description: Delete a group based on its name
      operationId: deleteGroup
      tags: [Group]
      parameters:
        - name: name
          in: path
          description: Name of group to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: group deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/FailedDependency'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /groups:
    get:
      summary: List groups
      description: Returns all groups
      operationId: listGroups
      tags: [Group]
      responses:
        '200':
          description: list group response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroups'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a new group
      description: Creates a new group. Duplicate names are not allowed
      operationId: createGroup
      tags: [Group]
      requestBody:
        description: Group to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '200':
          description: group response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /roles/{name}:
    get:
      summary: Find a role by name
      description: Returns a role based on its name
      operationId: findRole
      tags: [Role]
      parameters:
        - name: name
          in: path
          description: Name of role to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: role response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Update a role
      description: >-
        Replace the role's representation. Any optional field omitted from the
        request body is cleared.
      operationId: updateRole
      tags: [Role]
      parameters:
        - name: name
          in: path
          description: Current name of the role
          required: true
          schema:
            type: string
      requestBody:
        description: New values for the role
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRole'
      responses:
        '200':
          description: role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a role by name
      description: Delete a role based on its name
      operationId: deleteRole
      tags: [Role]
      parameters:
        - name: name
          in: path
          description: Name of role to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: role deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/FailedDependency'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /roles:
    get:
      summary: List roles
      description: Returns all roles
      operationId: listRoles
      tags: [Role]
      responses:
        '200':
          description: list role response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a new role
      description: >-
        Creates a new role. Duplicate names are not allowed, and every entry of
        methods must name an authorizable operation.
      operationId: createRole
      tags: [Role]
      requestBody:
        description: Role to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRole'
      responses:
        '200':
          description: role response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  parameters:
    PageNumber:
      name: page
      in: query
      description: page number
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: maximum number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: >-
        The request body, a path parameter or a query parameter is malformed or
        fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No credentials were supplied, or they are invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        The caller is authenticated but lacks the role for this operation, or is
        not a member of the group owning the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The target resource, or a resource it refers to, does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with the same unique identity already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FailedDependency:
      description: >-
        The operation is blocked by another resource that depends on the target,
        for example deleting a label still in use by annotations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: >-
        An error not otherwise documented for this operation, including
        unexpected server-side faults.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Pagination:
      required:
        - page
        - page_size
        - total_items
        - total_pages
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
          description: current page number
        page_size:
          type: integer
          minimum: 1
          description: maximum number of items per page
        total_items:
          type: integer
          format: int64
          description: total number of items
        total_pages:
          type: integer
          format: int64
          description: total number of pages
    Collection:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        description:
          type: string
          description: Description of the collection
        group:
          type: string
          description: Group of the collection
        profile:
          type: string
          description: Profile of the collection
    UpdateCollection:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New name
        description:
          type: string
          description: New description
        group:
          type: string
          description: New group
        profile:
          type: string
          description: New profile
    CloneCollection:
      type: object
      required:
        - source
        - destination
      properties:
        source:
          type: string
          description: Name of the existing source collection
        destination:
          type: string
          description: Name of the destination collection
        group:
          type: string
          description: Name of the group of destination collection
        deep:
          type: boolean
          description: Also clone annotations and meta-data
    ListCollections:
      type: object
      required:
        - collections
        - pagination
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListImages:
      type: object
      required:
        - images
        - pagination
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Image:
      required:
        - id
        - collection
      properties:
        id:
          type: string
          description: ID of the image
        collection:
          type: string
          description: name of collection in which the image belongs
        labels:
          type: array
          items:
            type: string
        bounding_boxes:
          type: array
          items:
            $ref: '#/components/schemas/BoundingBox'
        polygons:
          type: array
          items:
            $ref: '#/components/schemas/Polygon'
        meta:
          type: object
          additionalProperties: {}
    NewImage:
      required:
        - collection
      properties:
        collection:
          type: string
          description: name of collection in which to add the image
        labels:
          type: array
          items:
            type: string
        bounding_boxes:
          type: array
          items:
            $ref: '#/components/schemas/IngestBoundingBox'
    IngestBoundingBox:
      required:
        - label
        - xc
        - yc
        - width
        - height
      properties:
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
    AddBoundingBox:
      required:
        - imageId
        - collection
        - label
        - xc
        - yc
        - width
        - height
        - angle
      properties:
        imageId:
          type: string
          description: id of image
        collection:
          type: string
          description: name of collection
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
        angle:
          type: number
          description: angle of the bounding box
    AddPolygon:
      required:
        - imageId
        - collection
        - label
        - points
      properties:
        imageId:
          type: string
          description: ID of the image
        collection:
          type: string
          description: name of the collection
        label:
          type: string
          description: Label of the polygon
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    Meta:
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Key of the meta-data entry
        value:
          $ref: '#/components/schemas/MetaValue'
    MetaValue:
      description: Value of the meta-data entry (integer, float, boolean or ISO 8601 date-time)
      anyOf:
        - type: integer
          format: int64
        - type: number
          format: double
        - type: boolean
        - type: string
          format: date-time
    BoundingBox:
      required:
        - label
        - xc
        - yc
        - width
        - height
        - id
      properties:
        id:
          type: string
          description: ID of the bounding box
        label:
          type: string
          description: label
        xc:
          type: number
          description: x coordinate of the center point
        yc:
          type: number
          description: y coordinate of the center point
        width:
          type: number
          description: width of the bounding box
        height:
          type: number
          description: height of the bounding box
    ImageIngestionResponse:
      properties:
        id:
          type: string
          description: ID of ingested image
    Point:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
    Polygon:
      required:
        - id
        - label
        - points
      properties:
        id:
          type: string
          description: ID of the polygon
        label:
          type: string
          description: Label of the polygon
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    NewUser:
      required:
        - id
      properties:
        id:
          type: string
          description: Id of the new user
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    User:
      required:
        - id
        - groups
        - roles
      properties:
        id:
          type: string
          description: Id of the user
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    ListUsers:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UserPrivileges:
      required:
        - groups
        - roles
      properties:
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string        
    NewCollection:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        description:
          type: string
          description: Description of the collection
    Label:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the label
        description:
          type: string
